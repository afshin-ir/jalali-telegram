name: Sync upstream and build Linux

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  actions: write
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 150

      - name: Merge upstream dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/telegramdesktop/tdesktop.git
          git fetch --no-tags --depth=150 upstream dev
          git merge --no-edit --no-ff upstream/dev
          git push origin HEAD:dev

      - name: Start Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/linux.yml/dispatches" \
            -d '{"ref":"dev"}'
