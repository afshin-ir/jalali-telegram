name: انتشار نسخهٔ پایدار Linux 7.4.1

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/publish-release-v7.4.1.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت بیلد Linux ساخته‌شده
        uses: actions/download-artifact@v4
        with:
          name: Telegram
          path: release-assets
          run-id: 42419864705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: آماده‌سازی بسته و توضیحات فارسی
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/Telegram
          test -f release-assets/Updater
          chmod +x release-assets/Telegram release-assets/Updater
          zip -j release-assets/Telegram-7.4.1-linux-x86_64.zip release-assets/Telegram release-assets/Updater
          cat > release-notes.md <<'EOF'
          <div dir="rtl" align="right">

          # تلگرام جلالی ۷٫۴٫۱ — نخستین نسخهٔ پایدار

          این نسخه بر پایهٔ تلگرام دسکتاپ ۷٫۴٫۱ ساخته شده و شماره‌گذاری آن با نسخهٔ اصلی هماهنگ است.

          ## قابلیت افزوده‌شده

          - تاریخ پیام‌های دریافت‌شده و فرستاده‌شده در گفت‌وگوهای دونفره، گروه‌ها و کانال‌ها به تقویم جلالی نمایش داده می‌شود.
          - انتخابگر تاریخ نیز جلالی است و ماه، سال و روزهای ماه را بر اساس تقویم جلالی نشان می‌دهد.
          - ترتیب تاریخ روز، ماه، سال است؛ مانند «۱۷ آبان ۱۴۰۵».
          - این انتشار فقط برای Linux بسته‌بندی شده است.

          ## نصب

          فایل فشرده را استخراج کنید و فایل اجرایی Telegram را اجرا کنید. فایل Updater نیز کنار آن قرار دارد.

          </div>
          EOF

      - name: انتشار نسخه و بارگذاری فایل Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v7.4.1 \
            release-assets/Telegram-7.4.1-linux-x86_64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "تلگرام جلالی ۷٫۴٫۱" \
            --notes-file release-notes.md \
            --target c44bb02c2475cc5186b9c1199ac58443d870e785

      - name: حذف گردش‌کار موقت
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/publish-release-v7.4.1.yml';
            const { owner, repo } = context.repo;
            const file = await github.rest.repos.getContent({
              owner, repo, path, ref: 'dev'
            });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: 'Remove temporary stable release workflow',
              sha: file.data.sha,
              branch: 'dev'
            });
