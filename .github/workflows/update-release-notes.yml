name: Update Persian rolling release notes

on:
  push:
    branches:
      - dev
    paths:
      - RELEASE_NOTES_FA.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update the rolling release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit jalali-latest --notes-file RELEASE_NOTES_FA.md
