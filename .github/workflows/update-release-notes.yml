name: Update English release titles and notes

on:
  push:
    branches:
      - dev
    paths:
      - RELEASE_NOTES_EN.md
      - RELEASE_NOTES_7.4.1_EN.md
      - Telegram/SourceFiles/core/version.h
      - .github/workflows/update-release-notes.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - Linux.
    types:
      - completed

permissions:
  contents: write

jobs:
  update-release-notes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Update English release titles and descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version=$(sed -n 's/^constexpr auto AppVersionStr = "\([^"]*\)";/\1/p' Telegram/SourceFiles/core/version.h)
          if [ -z "$app_version" ]; then
            echo "::error::Could not read AppVersionStr from Telegram/SourceFiles/core/version.h."
            exit 1
          fi

          release_title="Telegram Desktop $app_version (Jalali Linux)"
          gh release edit jalali-latest --title "$release_title" --notes-file RELEASE_NOTES_EN.md
          gh release edit v7.4.1 --title "Telegram Desktop 7.4.1 with Jalali Calendar — First Stable Release" --notes-file RELEASE_NOTES_7.4.1_EN.md
