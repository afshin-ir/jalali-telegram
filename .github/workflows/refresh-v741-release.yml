name: Refresh Linux 7.4.1 release asset

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/refresh-v741-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  refresh-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Linux build
        uses: actions/download-artifact@v4
        with:
          name: Telegram
          path: artifact
          run-id: 42432224946
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux build
        run: |
          cd artifact
          zip -r ../Telegram-7.4.1-linux-x86_64.zip .

      - name: Replace release asset and update target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_COMMIT: 19688917e2cf959b920b332d45afe18e57684a3d
        run: |
          gh release edit v7.4.1 --repo afshin-ir/jalali-telegram --target "$TARGET_COMMIT"
          gh release upload v7.4.1 Telegram-7.4.1-linux-x86_64.zip --repo afshin-ir/jalali-telegram --clobber

      - name: Remove temporary workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/refresh-v741-release.yml';
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'dev'
              });
              await github.rest.repos.deleteFile({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'Remove temporary release workflow',
                sha: file.data.sha,
                branch: 'dev'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
