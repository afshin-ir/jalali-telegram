name: Publish latest Linux build

on:
  workflow_run:
    workflows: ["Linux."]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: Telegram
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux build
        run: |
          cd artifact
          zip -r ../Telegram-7.4.1-linux-x86_64.zip .

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release edit v7.4.1 --repo afshin-ir/jalali-telegram --target "$TARGET_COMMIT"
          gh release upload v7.4.1 Telegram-7.4.1-linux-x86_64.zip --repo afshin-ir/jalali-telegram --clobber

      - name: Remove temporary workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/publish-latest-linux.yml';
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'dev'
              });
              await github.rest.repos.deleteFile({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'Remove temporary release workflow',
                sha: file.data.sha,
                branch: 'dev'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
